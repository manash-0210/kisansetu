<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KisanSetu — Government Agricultural Procurement Management Platform</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom Tailwind Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            emerald: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              300: '#6ee7b7',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
              950: '#022c22'
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Leaflet CSS & JS for Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <!-- Supabase JS Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col antialiased selection:bg-emerald-200 selection:text-emerald-900 pb-mobile-nav">

  <!-- HEADER / NAVBAR -->
  <header id="app-header" class="w-full"></header>

  <!-- MAIN CONTENT CONTAINER -->
  <main id="app-content" class="flex-grow w-full"></main>

  <!-- MOBILE BOTTOM NAVIGATION -->
  <nav id="mobile-bottom-nav"></nav>

  <!-- GLOBAL TOAST NOTIFICATION CONTAINER -->
  <div id="toast-container" class="fixed bottom-20 md:bottom-6 right-4 sm:right-6 z-50 flex flex-col space-y-2 max-w-sm pointer-events-none"></div>

  <!-- GLOBAL MODAL DIALOG CONTAINER -->
  <div id="global-modal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-lg w-full shadow-2xl overflow-hidden transform transition-all animate-fadeIn" id="modal-content">
      <!-- Modal Content Injected Dynamically -->
    </div>
  </div>

  <!-- AUTH MODAL DIALOG CONTAINER -->
  <div id="auth-modal" class="fixed inset-0 z-50 hidden bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full shadow-2xl p-6 sm:p-8 space-y-6 relative">
      <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-xl font-bold">✕</button>
      
      <div class="text-center space-y-1">
        <div class="w-12 h-12 rounded-xl bg-emerald-600 text-white mx-auto flex items-center justify-center text-xl font-bold">KS</div>
        <h3 class="text-xl font-extrabold text-slate-900" id="auth-modal-title">Sign In to KisanSetu</h3>
        <p class="text-xs text-slate-500">Access live tokens, mandi bookings, and DBT payments.</p>
      </div>

      <!-- Auth Form Switcher Tabs -->
      <div class="flex bg-slate-100 p-1 rounded-xl text-xs font-bold">
        <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 py-2 rounded-lg bg-white shadow-sm text-emerald-700">Log In</button>
        <button id="tab-signup" onclick="switchAuthTab('signup')" class="flex-1 py-2 rounded-lg text-slate-600">Sign Up</button>
      </div>

      <div class="space-y-4 text-xs">
        <div>
          <label class="block font-bold text-slate-700 mb-1">User Role</label>
          <select id="auth-role" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 font-bold focus:outline-none focus:border-emerald-600">
            <option value="farmer">🌾 Farmer</option>
            <option value="staff">🏬 Procurement Mandi Staff</option>
            <option value="admin">🏛️ Government Admin</option>
          </select>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Email / Mobile ID</label>
          <input type="email" id="auth-email" value="" placeholder="farmer@example.com" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 font-semibold focus:outline-none focus:border-emerald-600"/>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Password</label>
          <div class="relative">
            <input type="password" id="auth-password" value="" placeholder="Enter your password" class="w-full bg-slate-50 border border-slate-300 rounded-lg pl-3 pr-10 py-2.5 font-semibold focus:outline-none focus:border-emerald-600"/>
            <button type="button" onclick="togglePasswordVisibility(); return false;" class="absolute right-2 top-1/2 -translate-y-1/2 p-1.5 text-slate-400 hover:text-emerald-700 focus:outline-none cursor-pointer z-10" title="Toggle password visibility">
              <svg id="pwd-eye-icon" class="w-5 h-5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
        </div>

        <div id="signup-extra-fields" class="space-y-3 hidden">
          <div>
            <label class="block font-bold text-slate-700 mb-1">Full Name</label>
            <input type="text" id="auth-fullname" placeholder="Your Full Name" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 font-semibold"/>
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">District / Village</label>
            <input type="text" id="auth-location" placeholder="Sonapur, Kamrup" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 font-semibold"/>
          </div>
        </div>

        <button onclick="handleAuthSubmit()" id="auth-submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-3 rounded-xl shadow-lg shadow-emerald-600/30 transition-transform active:scale-95 text-sm">
          Log In →
        </button>

        <!-- Divider -->
        <div class="relative flex py-1 items-center">
          <div class="flex-grow border-t border-slate-200"></div>
          <span class="flex-shrink mx-3 text-slate-400 text-[10px] uppercase font-bold tracking-wider">or</span>
          <div class="flex-grow border-t border-slate-200"></div>
        </div>

        <!-- Google Sign-In Button -->
        <button onclick="signInWithGoogle()" type="button" class="w-full bg-white hover:bg-slate-50 border border-slate-300 text-slate-700 font-bold py-2.5 rounded-xl shadow-sm transition-all flex items-center justify-center space-x-2 text-xs cursor-pointer">
          <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Continue with Google</span>
        </button>
      </div>

      <p class="text-[11px] text-center text-slate-400">Secured by Supabase Auth & Government PM-KISAN Registry</p>
    </div>
  </div>

  <!-- APPLICATION SCRIPTS -->
  <script src="js/data.js?v=3.0"></script>
  <script src="js/translations.js?v=3.0"></script>
  <script src="js/supabase-config.js?v=3.0"></script>
  <script src="js/app.js?v=3.0"></script>

</body>
</html>
